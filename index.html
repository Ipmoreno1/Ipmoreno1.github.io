<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isaac Moreno / UTEP Pixel Campus</title>
<meta name="description" content="Isaac Moreno, Computer Science senior at UTEP with a Minor in Mathematics. Walk a pixel-art UTEP campus where every landmark opens part of his portfolio.">
<meta property="og:title" content="Isaac Moreno / UTEP Pixel Campus">
<meta property="og:description" content="A playable pixel-art portfolio set on the UTEP campus in El Paso, TX.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://ipmoreno1.github.io/assets/og-image.png">
<meta property="og:url" content="https://ipmoreno1.github.io/">
<meta name="theme-color" content="#1e3a4a">
<link rel="icon" href="assets/favicon.png">
<link rel="preload" href="assets/fonts/PressStart2P.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body tabindex="-1">
<a class="skiplink" href="recruiter.html">Skip the game: plain recruiter view</a>
<main id="game" aria-label="Playable campus">
  <canvas id="screen" role="img" aria-label="Pixel-art map of the UTEP campus"></canvas>
  <div id="signs" aria-hidden="true"></div>
  <button id="pet-btn" class="pet-btn" hidden>♥ Pet Chispa</button>
</main>

<header class="hud-top">
  <div class="hud-left">
  <div id="profile" class="card">
    <canvas id="portrait" width="32" height="32" aria-hidden="true"></canvas>
    <div class="who"><b>ISAAC MORENO</b><span>CS senior at UTEP</span></div>
    <button id="about-btn" class="mini" aria-label="About me, open Miner Card">☺ About me</button>
  </div>
  <a id="skip-btn" class="card skipgame" href="recruiter.html"><span class="long">Skip game and explore projects</span><span class="short">Skip game</span> ▶</a>
  </div>
  <div id="plate" class="card plate" aria-live="polite"><b id="plate-area">MAIN CAMPUS</b><span id="plate-sub">DESERT · DAYTIME</span></div>
</header>

<div id="strip" aria-hidden="true"></div>
<nav id="dock" class="card" aria-label="Game controls">
  <div class="tabs">
    <button data-open="log" aria-keyshortcuts="P">Dig Log</button>
    <button data-open="map" aria-keyshortcuts="M">Map</button>
    <a href="assets/Resume_Isaac_Moreno.pdf" target="_blank" rel="noopener">Resume ↗</a>
    <button data-open="about">About me</button>
    <button data-open="contact" aria-keyshortcuts="C">Contact</button>
  </div>
  <div class="row">
    <div class="dpad" role="group" aria-label="Direction pad">
      <button data-dir="0,-1" class="d-up" aria-label="Move up">▲</button>
      <button data-dir="-1,0" class="d-left" aria-label="Move left">◀</button>
      <span class="d-mid" aria-hidden="true"></span>
      <button data-dir="1,0" class="d-right" aria-label="Move right">▶</button>
      <button data-dir="0,1" class="d-down" aria-label="Move down">▼</button>
    </div>
    <div class="dlabel"><b>Move</b><small>WASD / arrows</small></div>
    <button id="run-btn" class="run" aria-pressed="false" aria-label="Run (hold Shift)">Run<kbd>Shift</kbd></button>
    <button id="act-btn" class="act" disabled aria-keyshortcuts="E"><kbd>E</kbd><span id="act-label">Interact</span></button>
    <div class="side">
      <button data-open="help" class="mini">? Help</button>
      <button id="world-btn" class="mini" aria-expanded="false" aria-controls="world-menu">World options ▴</button>
    </div>
  </div>
</nav>

<div id="world-menu" class="card pop" hidden>
  <label for="opt-time">Time of day</label>
  <select id="opt-time"><option value="auto">Auto · El Paso clock</option><option value="day">Day</option><option value="dusk">Dusk</option><option value="night">Night</option></select>
  <label for="opt-weather">Weather</label>
  <select id="opt-weather"><option value="clear">Clear desert sky</option><option value="monsoon">Monsoon rain</option><option value="dust">Dust storm</option></select>
  <button id="opt-dusk">Switch to dusk</button>
  <button id="opt-sound" aria-pressed="false">Sound off</button>
  <button id="opt-start">Back to start</button>
  <div class="zoom"><button id="opt-zout" aria-label="Zoom out">−</button><span>Zoom</span><button id="opt-zin" aria-label="Zoom in">+</button></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="modal-wrap" hidden>
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title-sr">
    <div id="modal-head"><span id="crumb"></span><span id="modal-title-sr" class="sr"></span><span id="hdr-extra"></span><button id="modal-close" class="btn ghost">X Close</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="bus-fx" hidden aria-hidden="true"><canvas id="bus-canvas"></canvas><div id="bus-card"></div></div>

<noscript>
  <div class="noscript">
    <h1>Isaac Moreno</h1>
    <p>Computer Science senior at UTEP, Minor in Mathematics. Expected graduation Dec 2026. El Paso, TX.</p>
    <p>This playable campus needs JavaScript. Everything is also on the <a href="recruiter.html">plain recruiter page</a>, and the <a href="assets/Resume_Isaac_Moreno.pdf">resume PDF</a>.</p>
    <p>Email: <a href="mailto:ipmoreno1@miners.utep.edu">ipmoreno1@miners.utep.edu</a> · <a href="https://linkedin.com/in/isaac-moreno">LinkedIn</a> · <a href="https://github.com/Ipmoreno1">GitHub</a></p>
    <p class="fine">Fan-inspired by playable portfolios, not affiliated with any game company.</p>
  </div>
</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
